# =============================================================================
# SIMPLIFICAPSI - DOCKER COMPOSE (DEVELOPMENT)
# =============================================================================

version: "3.8"

services:
  # =============================================================================
  # POSTGRESQL DATABASE
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: simplificapsi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simplificapsi_dev
      POSTGRES_USER: simplificapsi
      POSTGRES_PASSWORD: simplificapsi123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # host 5433 -> container 5432 (avoid colliding with a local Postgres on 5432)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplificapsi -d simplificapsi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simplificapsi_network

  # =============================================================================
  # REDIS CACHE
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: simplificapsi_redis
    restart: unless-stopped
    ports:
      # host 6380 -> container 6379 (avoid colliding with a local Redis on 6379)
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simplificapsi_network

  # =============================================================================
  # SIMPLIFICAPSI APPLICATION
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: simplificapsi_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://simplificapsi:simplificapsi123@postgres:5432/simplificapsi_dev
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - /app/.venv # Exclude virtual environment from volume
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - simplificapsi_network

  # =============================================================================
  # PGADMIN (Database Management)
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: simplificapsi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@simplificapsi.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - simplificapsi_network

  # =============================================================================
  # REDIS COMMANDER (Redis Management)
  # =============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: simplificapsi_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - simplificapsi_network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  app_logs:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  simplificapsi_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
