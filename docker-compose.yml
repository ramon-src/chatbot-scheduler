# =============================================================================
# SIMPLIFICAPSI - DOCKER COMPOSE (DEVELOPMENT)
# =============================================================================

version: "3.8"

services:
  # =============================================================================
  # POSTGRESQL DATABASE
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: simplificapsi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simplificapsi_dev
      POSTGRES_USER: simplificapsi
      POSTGRES_PASSWORD: simplificapsi123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # host 5433 -> container 5432 (avoid colliding with a local Postgres on 5432)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplificapsi -d simplificapsi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simplificapsi_network

  # =============================================================================
  # REDIS CACHE
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: simplificapsi_redis
    restart: unless-stopped
    ports:
      # host 6380 -> container 6379 (avoid colliding with a local Redis on 6379)
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simplificapsi_network

  # =============================================================================
  # SIMPLIFICAPSI APPLICATION
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: simplificapsi_app
    restart: unless-stopped
    ports:
      # host 8010 -> container 8000 (avoid colliding with a local service on 8000)
      - "8010:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://simplificapsi:simplificapsi123@postgres:5432/simplificapsi_dev
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - /app/.venv # Exclude virtual environment from volume
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - simplificapsi_network

  # =============================================================================
  # PGADMIN (Database Management)
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: simplificapsi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@simplificapsi.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - simplificapsi_network

  # =============================================================================
  # REDIS COMMANDER (Redis Management)
  # =============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: simplificapsi_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - simplificapsi_network

  # =============================================================================
  # EVOLUTION API — POSTGRES (dedicated DB for the WhatsApp provider)
  # =============================================================================
  evolution_postgres:
    image: postgres:15-alpine
    container_name: simplificapsi_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simplificapsi_network

  # =============================================================================
  # EVOLUTION API (default WhatsApp provider — inbound webhook + outbound send)
  # =============================================================================
  # Bring up with: make evolution   (then: make evolution-instance, make evolution-qr)
  # Global webhook posts to the app's Evolution endpoint. The app is expected to
  # run locally (make run) on host port 8010, reachable from the container as
  # host.docker.internal. If you run the app inside compose instead, change
  # WEBHOOK_GLOBAL_URL to http://app:8000/webhooks/evolution.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: simplificapsi_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: evolution-dev-key
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      # Persistence (Postgres)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution_postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Cache (reuse the existing Redis, separate logical DB index)
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Global webhook -> SimplificaPsi app inbound endpoint (all instances)
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:8010/webhooks/evolution
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - evolution_instances:/evolution/instances
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      evolution_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - simplificapsi_network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  app_logs:
    driver: local
  evolution_postgres_data:
    driver: local
  evolution_instances:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  simplificapsi_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
