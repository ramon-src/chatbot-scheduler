[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplifica-psi"
version = "0.1.0"
description = "Sistema de Agentes AI para Gestão de Consultórios Psicológicos"
authors = [
    {name = "SimplificaPsi Team", email = "team@simplificapsi.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["ai", "agents", "psychology", "scheduling", "pydantic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core AI Framework (slim = lean; only the OpenAI provider, which also serves OpenRouter)
    "pydantic-ai-slim[openai]>=1.41.0",
    "pydantic>=2.12.0",
    "openai>=2.14.0",

    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",

    # Cache & Session (redis-py ships native async; aioredis is obsolete)
    "redis>=6.2.0",

    # HTTP Client
    "httpx>=0.28.0",

    # Google Calendar Integration
    "google-auth>=2.38.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.160.0",

    # WhatsApp / multipart
    "python-multipart>=0.0.20",

    # Environment & Config
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.12.0",

    # Logging & Monitoring
    "structlog>=24.4.0",
    "rich>=13.9.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "phonenumbers>=8.13.50",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",  # For testing FastAPI

    # Agent evaluation harness (Plan 5)
    "pydantic-evals>=1.41.0",

    # Code Quality (ruff handles lint + format + import sorting; black/isort retired)
    "ruff>=0.9.0",
    "mypy>=1.14.0",

    # Pre-commit
    "pre-commit>=4.0.0",

    # Development Tools
    "ipython>=8.30.0",
]

test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pydantic-evals>=1.41.0",
    "httpx>=0.28.0",
]

prod = [
    "gunicorn>=23.0.0",
    "sentry-sdk[fastapi]>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/simplificapsi/simplifica-psi-python"
Documentation = "https://docs.simplificapsi.com"
Repository = "https://github.com/simplificapsi/simplifica-psi-python"
Issues = "https://github.com/simplificapsi/simplifica-psi-python/issues"

[project.scripts]
simplifica-psi = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # function calls in argument defaults (FastAPI Depends pattern)
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "redis.*",
    "aioredis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
